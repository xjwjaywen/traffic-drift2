data:
  batch_size: 512
  data_dir: ./data/tls22
  dataset: tls22
  num_workers: 16
  size: S
  test_period: M-2022-5
  train_period: M-2022-3
  val_ratio: 0.2
model:
  backbone: transformer
  dropout: 0.1
  enable_fsr: true
  enable_mpfp: true
  enable_pop: true
  flow_stats_dim: 0
  fsr_target_dim: 6
  hidden_dim: 256
  num_heads: 4
  num_layers: 4
output_dir: outputs/tls22_transformer
ssl:
  alpha: 0.2
  beta: 0.1
  enable_fsr: true
  enable_mpfp: true
  enable_pop: true
  mask_ratio: 0.15
training:
  epochs: 30
  lr: 0.0005
  ssl_weight: 1.0
  weight_decay: 0.0001
