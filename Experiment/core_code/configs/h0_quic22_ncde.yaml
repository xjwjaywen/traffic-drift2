# H0 feasibility check: NCDE baseline on CESNET-QUIC22 W-44.
# Run from Experiment/core_code:
#   CUDA_VISIBLE_DEVICES=0 python train_h0_ncde.py --config configs/h0_quic22_ncde.yaml

seed: 42
device: cuda

data:
  dataset: quic22
  data_dir: ./data/quic22
  size: S
  train_period: "W-2022-44"
  test_period: "W-2022-44"
  batch_size: 1024
  num_workers: 16
  val_ratio: 0.2
  use_flow_stats: false

model:
  input_channels: 3
  hidden_dim: 64
  interpolation: linear
  solver: euler
  solver_step_size: 1.0
  preprocess: log1p_size_iat
  normalize_input: true
  add_time_channel: true
  vector_field_hidden_dim: 128
  vector_field_layers: 2

normalization:
  max_batches: 1024

training:
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  max_train_batches:
  max_val_batches:

comparison:
  cnn_results_path: outputs/quic22_cnn/train_results.json
  cnn_metric: best_val_f1
  ncde_metric: best_val_f1
  pass_within: 0.03
  stop_if_lower_than: 0.05

output_dir: outputs/h0_quic22_ncde
