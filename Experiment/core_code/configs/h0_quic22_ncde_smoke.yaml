# Short H0 sanity run before launching the full W-44 experiment.
# Run from Experiment/core_code:
#   CUDA_VISIBLE_DEVICES=0 CONFIG=configs/h0_quic22_ncde_smoke.yaml bash scripts/run_h0_ncde.sh

seed: 42
device: cuda

data:
  dataset: quic22
  data_dir: ./data/quic22
  size: S
  train_period: "W-2022-44"
  test_period: "W-2022-44"
  batch_size: 1024
  num_workers: 16
  val_ratio: 0.2
  use_flow_stats: false

model:
  input_channels: 3
  hidden_dim: 64
  interpolation: linear
  solver: euler
  solver_step_size: 1.0
  normalize_input: true
  add_time_channel: true
  vector_field_hidden_dim: 128
  vector_field_layers: 2

normalization:
  max_batches: 256

training:
  epochs: 5
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  max_train_batches: 1000
  max_val_batches: 100

comparison:
  cnn_results_path: outputs/quic22_cnn/train_results.json
  cnn_metric: best_val_f1
  ncde_metric: best_val_f1
  pass_within: 0.03
  stop_if_lower_than: 0.05

output_dir: outputs/h0_quic22_ncde_smoke
