# Diagnostic supervised CNN smoke run using the same data split and batch limits
# as the H0 NCDE smoke config.
#
# Run from Experiment/core_code:
#   CUDA_VISIBLE_DEVICES=0 python train_h0_cnn_smoke.py --config configs/h0_quic22_cnn_smoke.yaml

seed: 42
device: cuda

data:
  dataset: quic22
  data_dir: ./data/quic22
  size: S
  train_period: "W-2022-44"
  test_period: "W-2022-44"
  batch_size: 1024
  num_workers: 16
  val_ratio: 0.2
  use_flow_stats: false

model:
  backbone: cnn
  hidden_dim: 256
  norm_type: gn
  num_groups: 8
  flow_stats_dim: 0
  enable_mpfp: false
  enable_pop: false
  enable_fsr: false
  fsr_target_dim: 6

training:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  max_train_batches: 1000
  max_val_batches: 100

output_dir: outputs/h0_quic22_cnn_smoke
