# Evaluation config: CausalState-TTA on CESNET-QUIC22
# Compares causal state-space TTA against static, baselines, and TTA-TC

data:
  dataset: quic22
  data_dir: ./data/quic22
  size: S
  train_period: "W-2022-44"
  test_period: "W-2022-45"
  test_periods:
    - "W-2022-45"
    - "W-2022-46"
    - "W-2022-47"
  batch_size: 256
  num_workers: 4

methods:
  - static
  - tent
  - eata
  - sar
  - note
  - tta_tc
  - causal_state

tta:
  # General TTA baseline params
  adapt_lr: 0.00001
  adapt_mode: encoder
  ema_momentum: 0.999
  restore_prob: 0.01
  fisher_alpha: 2000.0
  entropy_filter_ratio: 0.4
  buffer_size: 2000

  # TTA-TC v9 params
  label_budget_per_period: 500
  proto_blend: 0.2
  tta_blend: 0.8
  spa_temperature: 0.1

  # CausalState-TTA params
  q_causal: 0.0001
  q_spurious: 0.01
  r_base: 0.1
  kf_temperature: 0.1
  kf_min_samples: 3
  drift_ema_alpha: 0.1
  entropy_filter_q: 0.4
  cs_label_budget: 50       # only 50 labels (vs TTA-TC's 500)
  labeled_r_scale: 0.1      # low observation noise for labeled samples

output_dir: outputs/eval_quic22_causal
