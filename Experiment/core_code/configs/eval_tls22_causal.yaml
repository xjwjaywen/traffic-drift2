# Evaluation config: CausalState-TTA on CESNET-TLS-Year22 (long-term)
# 9-month sequential evaluation

data:
  dataset: tls22
  data_dir: ./data/tls22
  size: S
  train_period: "M-2022-3"
  test_period: "M-2022-5"
  test_periods:
    - "M-2022-4"
    - "M-2022-5"
    - "M-2022-6"
    - "M-2022-7"
    - "M-2022-8"
    - "M-2022-9"
    - "M-2022-10"
    - "M-2022-11"
    - "M-2022-12"
  batch_size: 256
  num_workers: 4

methods:
  - static
  - tent
  - eata
  - sar
  - note
  - tta_tc
  - causal_state

tta:
  # General TTA baseline params
  adapt_lr: 0.00001
  adapt_mode: encoder
  ema_momentum: 0.999
  restore_prob: 0.01
  fisher_alpha: 2000.0
  entropy_filter_ratio: 0.4
  buffer_size: 2000

  # TTA-TC v9 params
  label_budget_per_period: 500
  proto_blend: 0.2
  tta_blend: 0.8
  spa_temperature: 0.1

  # CausalState-TTA params
  q_causal: 0.0001
  q_spurious: 0.01
  r_base: 0.1
  kf_temperature: 0.1
  kf_min_samples: 2
  drift_ema_alpha: 0.1

output_dir: outputs/eval_tls22_causal
