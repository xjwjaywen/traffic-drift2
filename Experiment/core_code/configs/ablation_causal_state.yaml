# Ablation study: CausalState-TTA hyperparameters
# Tests the contribution of each component

data:
  dataset: quic22
  data_dir: ./data/quic22
  size: S
  train_period: "W-2022-44"
  test_period: "W-2022-45"
  test_periods:
    - "W-2022-45"
    - "W-2022-46"
    - "W-2022-47"
  batch_size: 256
  num_workers: 4

# Each ablation is a named config variant
ablations:
  # A-CS1: Causal mask vs no mask
  no_causal_mask:
    description: "CausalState without causal mask (uniform Q for all dims)"
    methods: [static, causal_state]
    tta:
      q_causal: 0.005
      q_spurious: 0.005   # same as causal → no distinction
      tta_blend: 0.5
      kf_temperature: 0.1

  with_causal_mask:
    description: "CausalState with causal mask (default)"
    methods: [static, causal_state]
    tta:
      q_causal: 0.0001
      q_spurious: 0.01
      tta_blend: 0.5
      kf_temperature: 0.1

  # A-CS2: SSL drift estimation vs fixed Q
  no_drift_estimation:
    description: "Fixed Q scale (no SSL-based dynamic adjustment)"
    methods: [static, causal_state]
    tta:
      q_causal: 0.0001
      q_spurious: 0.01
      drift_ema_alpha: 0.0   # EMA alpha=0 → drift_ema stays at base_ssl_loss → scale=1.0
      tta_blend: 0.5

  with_drift_estimation:
    description: "Dynamic Q via MPFP drift signal (default)"
    methods: [static, causal_state]
    tta:
      q_causal: 0.0001
      q_spurious: 0.01
      drift_ema_alpha: 0.1
      tta_blend: 0.5

  # A-CS3: Blending weight sweep
  blend_0.3:
    methods: [static, causal_state]
    tta: {tta_blend: 0.3, q_causal: 0.0001, q_spurious: 0.01}
  blend_0.5:
    methods: [static, causal_state]
    tta: {tta_blend: 0.5, q_causal: 0.0001, q_spurious: 0.01}
  blend_0.7:
    methods: [static, causal_state]
    tta: {tta_blend: 0.7, q_causal: 0.0001, q_spurious: 0.01}
  blend_0.9:
    methods: [static, causal_state]
    tta: {tta_blend: 0.9, q_causal: 0.0001, q_spurious: 0.01}

  # A-CS4: Process noise ratio sweep
  q_ratio_10x:
    description: "Q_spurious / Q_causal = 10"
    methods: [static, causal_state]
    tta: {q_causal: 0.001, q_spurious: 0.01, tta_blend: 0.5}
  q_ratio_100x:
    description: "Q_spurious / Q_causal = 100 (default)"
    methods: [static, causal_state]
    tta: {q_causal: 0.0001, q_spurious: 0.01, tta_blend: 0.5}
  q_ratio_1000x:
    description: "Q_spurious / Q_causal = 1000"
    methods: [static, causal_state]
    tta: {q_causal: 0.00001, q_spurious: 0.01, tta_blend: 0.5}

  # A-CS5: Causal ratio sweep
  causal_ratio_0.3:
    description: "30% dims marked causal"
    methods: [static, causal_state]
    tta: {q_causal: 0.0001, q_spurious: 0.01, tta_blend: 0.5}
  causal_ratio_0.5:
    description: "50% dims marked causal (default)"
    methods: [static, causal_state]
    tta: {q_causal: 0.0001, q_spurious: 0.01, tta_blend: 0.5}
  causal_ratio_0.7:
    description: "70% dims marked causal"
    methods: [static, causal_state]
    tta: {q_causal: 0.0001, q_spurious: 0.01, tta_blend: 0.5}

output_dir: outputs/ablations/causal_state
