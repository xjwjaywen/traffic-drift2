# Training config: CESNET-TLS-Year22 with Transformer backbone

data:
  dataset: tls22
  data_dir: ./data/tls22
  size: S
  train_period: "M-2022-3"
  test_period: "M-2022-5"
  batch_size: 512
  num_workers: 16
  val_ratio: 0.2

model:
  backbone: transformer
  hidden_dim: 256
  num_layers: 4
  num_heads: 4
  dropout: 0.1
  flow_stats_dim: 0
  enable_mpfp: true
  enable_pop: true
  enable_fsr: true
  fsr_target_dim: 6

ssl:
  alpha: 0.2
  beta: 0.1
  mask_ratio: 0.15
  enable_mpfp: true
  enable_pop: true
  enable_fsr: true

training:
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  ssl_weight: 1.0

output_dir: outputs/tls22_transformer
